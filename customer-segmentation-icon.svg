<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Customer Segmentation Diagram</title>
  <desc id="desc">A full pie chart with four equal partitions and larger customer icons.</desc>
  <rect width="320" height="240" fill="#ffffff"/>
  <rect x="20" y="22" width="280" height="196" rx="12" fill="#f8fbff"/>

  <!-- Full pie chart with clear partition boundaries -->
  <g transform="translate(160 122)">
    <path d="M0 0 L0 -82 A82 82 0 0 1 82 0 Z" fill="#0d2c62"/>
    <path d="M0 0 L82 0 A82 82 0 0 1 0 82 Z" fill="#68d9f4"/>
    <path d="M0 0 L0 82 A82 82 0 0 1 -82 0 Z" fill="#2f5fa5"/>
    <path d="M0 0 L-82 0 A82 82 0 0 1 0 -82 Z" fill="#a8e6f7"/>

    <line x1="0" y1="0" x2="0" y2="-82" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="0" x2="82" y2="0" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="82" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="0" x2="-82" y2="0" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Reusable customer icon (all equal size) -->
  <defs>
    <g id="customer-icon">
      <circle cx="0" cy="-7" r="8"/>
      <rect x="-8" y="2" width="16" height="18" rx="4"/>
    </g>
  </defs>

  <!-- One equal icon per partition -->
  <g fill="#0d2c62">
    <use href="#customer-icon" x="191" y="91"/>
    <use href="#customer-icon" x="191" y="153"/>
    <use href="#customer-icon" x="129" y="153"/>
    <use href="#customer-icon" x="129" y="91"/>
  </g>
</svg>
